                "schema": {
                  "type": "object",
                  "additionalProperties": true,
                  "title": "Response V1 News Article V1 News Article Post"
                }
              }
            }
          },
          "422": {
            "description": "Validation Error",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HTTPValidationError"

{
  "openapi": "3.0.3",
  "info": {
    "title": "News Article Extractor API",
    "version": "1.0.0",
    "description": "Extract clean article text, titles, and metadata from news URLs - ready for NLP pipelines."
  },
  "servers": [
    {
      "url": "https://data.dataleads.pro/v1"
    }
  ],
